name: 构建并发布到 GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# 允许 Actions 写入 Pages 部署
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署。注意 cancel-in-progress 必须是 false：
# 半路掐掉一次正在进行的 Pages 部署，线上会停在上一版甚至留下失败状态，
# 后面那次排队的构建反而要等更久。让它排队跑完更稳。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      # 本模板零 npm 依赖，故意不跑 npm ci / npm install

      - name: 拉取上游站点快照到 src/
        run: node tools/fetch-src.js

      - name: 单元测试
        run: node tools/test/run.js

      - name: 构建静态站点
        run: node tools/build.js

      - name: 校验产物
        run: |
          test -f dist/index.html || { echo "缺少 dist/index.html"; exit 1; }
          test -f dist/404.html   || { echo "缺少 dist/404.html";   exit 1; }
          test -f dist/.nojekyll  || { echo "缺少 dist/.nojekyll";  exit 1; }
          echo "产物文件数：$(find dist -type f | wc -l)"

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: 部署
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
